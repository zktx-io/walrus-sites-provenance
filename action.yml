name: 'Walrus Sites Provenance'
description: 'Deploy Walrus Sites with verifiable SLSA provenance and optional remote signer support.'
author: 'zktx.io'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  git-signer-pin:
    description: 'PIN used to decrypt the signing key, shared with the remote signer UI.'
    required: false

outputs:
  site-object-id:
    description: 'Sui object ID of the created or updated Walrus Site.'
  site-base36:
    description: 'Base36 Walrus Site identifier derived from the site object ID.'
  site-url:
    description: 'Portal URL emitted for the target network.'

runs:
  using: 'node24'
  main: 'dist/index.js'
